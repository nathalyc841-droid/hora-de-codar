<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var contatos = [];

var comando = prompt("Digite um comando (ADICIONAR, BUSCAR, REMOVER, LISTAR, SAIR):").toUpperCase();

while (comando !== "SAIR") {

    switch (comando) {

        case "ADICIONAR":

            var nome = prompt("Nome:");
            var telefone = prompt("Telefone:");

            var contato = {
                nome: nome,
                telefone: telefone
            };

            contatos.push(contato);

            alert("Contato adicionado!");

            break;


        case "BUSCAR":

            var nomeBusca = prompt("Nome:");
            var encontrado = false;

            for (var i = 0; i < contatos.length; i++) {

                if (contatos[i].nome.toLowerCase() === nomeBusca.toLowerCase()) {

                    alert("Telefone: " + contatos[i].telefone);
                    encontrado = true;
                    break;
                }
            }

            if (encontrado === false) {
                alert("Contato não encontrado");
            }

            break;


        case "REMOVER":

            var nomeRemover = prompt("Nome:");
            var removido = false;

            for (var i = 0; i < contatos.length; i++) {

                if (contatos[i].nome.toLowerCase() === nomeRemover.toLowerCase()) {

                    contatos.splice(i, 1);

                    alert("Contato removido!");
                    removido = true;
                    break;
                }
            }

            if (removido === false) {
                alert("Contato não encontrado");
            }

            break;


        case "LISTAR":

            if (contatos.length === 0) {

                alert("Nenhum contato cadastrado.");

            } else {

                var lista = "Contatos cadastrados:\n\n";

                for (var i = 0; i < contatos.length; i++) {

                    lista += "Nome: " + contatos[i].nome +
                             "\nTelefone: " + contatos[i].telefone +
                             "\n\n";
                }

                alert(lista);
            }

            break;


        default:

            alert("Comando inválido.");

            break;
    }

    comando = prompt("Digite um comando (ADICIONAR, BUSCAR, REMOVER, LISTAR, SAIR):").toUpperCase();
}

alert("Agenda encerrada. Total de contatos: " + contatos.length);
    </script>
</body>
</html>
