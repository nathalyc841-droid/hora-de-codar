<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Calcule e exiba a média aritmética dos números inteiros de 15 a 100 (inclusive).
      
       var numero1 = 15;
       var numero2 = 100
        var soma = 0;
        while(numero1 <= numero2){
            soma += numero1;
            numero1++;
        }
        var media = soma  / (numero2 - 15 + 1);
        alert ("A média aritmética dos números inteiros de 15 a 100 é: " + media);  
       
        
    </script>
</body>
</html>
