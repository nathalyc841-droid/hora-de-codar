<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        // Calcule e exiba a média aritmética dos números inteiros de 15 a 100 (inclusive).
     let soma = 0;

for (let i = 15; i <= 100; i++) {
    soma += i;
}

let media = soma / (100 - 15 + 1);

alert("A média aritmética dos números inteiros de 15 a 100 é: " + media);
    
    </script>
</body>
</html>
