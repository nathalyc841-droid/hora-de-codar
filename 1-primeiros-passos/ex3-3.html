<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Calcule e exiba a média aritmética dos números inteiros de 15 a 100 (inclusive).
      
       var num1 = 15;
        var valor = 0;
        var cont = 1;
        while(num1 <100){
            valor += num1;
            num1++
            cont++
        }
        alert(valor/cont);
        
    </script>
</body>
</html>
