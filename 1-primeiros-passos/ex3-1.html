<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <script>
        //  Crie uma bomba-relógio com contagem regressiva de 30 até 0 e, ao final, escreva `EXPLOSÃO`.
     
        for (var i = 30; i >= 0; i--) {
            console.log(i);
        }
        console.log("EXPLOSÃO");
        

    </script>
    
</body>
</html>
