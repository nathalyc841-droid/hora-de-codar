<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //  Crie uma bomba-relógio com contagem regressiva de 30 até 0 e, ao final, escreva `EXPLOSÃO`.
     var inicio=30;
     var fim = 0;

        while (inicio>fim) {
            document.write(inicio+"</p>");

            inicio--
        }
        document.write("EXPLOSÃO");
        

    </script>
    
</body>
</html>
