<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Leia um valor `N` (N > 0) e imprima todos os inteiros de 1 até `N`.
    
        let N = Number(prompt("Digite um número maior que 0:"));

    while (N <= 0) {
    N = Number(prompt("Valor inválido! Digite um número maior que 0:"));
    }

    let resultado = "";

    for (let i = 1; i <= N; i++) {
    resultado += i + " ";
    }

    alert(resultado);

    </script>
</body>
</html>
