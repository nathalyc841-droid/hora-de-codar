<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Leia dois inteiros (sendo o primeiro menor que o segundo) e calcule a média desses números e de todos os inteiros entre eles.

    let numero1 = parseInt(prompt("Insira um número:"));
    let numero2 = parseInt(prompt("Insira um segundo número:"));

    while (numero1 >= numero2) {
    numero1 = parseInt(prompt("O primeiro número deve ser menor que o segundo. Tente novamente:"));
    }

    // Calculando a média dos números inteiros entre numero1 e numero2

    let soma = 0; // acumulador
    let quantidade = 0;

    for (let i = numero1; i <= numero2; i++) {  // Enquanto o valor que está dentro da caixa i for menor ou igual a numero2, continue o for.
    soma += i;
    quantidade++;
    }

    let media = soma / quantidade;

    alert("A média é: " + media);


    </script>
    </body>
    </html>
