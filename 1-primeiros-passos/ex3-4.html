<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let n1 = parseInt(prompt("Insira um número:"));
    let n2 = parseInt(prompt("Insira um segundo número:"));

    while (n1 >= n2) {
    n1 = parseInt(prompt("O primeiro número deve ser menor que o segundo. Tente novamente:"));
    }

    let soma = 0;
    let quantidade = 0;

    for (let i = n1; i <= n2; i++) {
    soma += i;
    quantidade++;
    }

    let media = soma / quantidade;

    alert("A média é: " + media);


    </script>
    </body>
    </html>
