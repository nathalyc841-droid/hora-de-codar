    <script>
        // Leia 10 valores e informe quantos estão no intervalo de 24 a 42 (inclusive) e quantos estão fora.
       
        let dentro = 0;
let fora = 0;

for (let i = 1; i <= 10; i++) {

    let valor = Number(prompt("Digite o " + i + "º valor:"));

    if (valor >= 24 && valor <= 42) {
        dentro++;
    } else {
        fora++;
    }
}

alert("Valores dentro do intervalo: " + dentro +
      "\nValores fora do intervalo: " + fora);

    </script>
