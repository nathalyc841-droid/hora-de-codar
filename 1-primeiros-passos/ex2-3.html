<body>
    
    <script>
        // Leia 3 valores diferentes e mostre o maior.

        var numero1 = Number (prompt("insira o primeiro numero:"));
        var numero2 = Number (prompt("insira o segundo numero:"));
        var numero3 = Number (prompt("insira o terceiro numero:"));

        if (numero1 > numero2 && numero1 > numero3) {
            alert (numero1 + " é o maior");

        } else if (numero2 > numero1 && numero2 > numero3) {
            alert (numero2 + " é o maior");
            
        } else {
            alert (numero3 + " é o maior");
        }

    </script>
