<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Leia 6 valores, exiba todos e calcule a média aritmética.

        var numero1 = Number (prompt("insira um numero:"));
        var numero2 = Number (prompt("insira um segundo numero:"));
        var numero3 = Number (prompt("insira um terceiro numero:"));
        var numero4 = Number (prompt("insira um quarto numero:"));
        var numero5 = Number (prompt("insira um quinto numero:"));
        var numero6 = Number (prompt("insira um sexto numero:"));

        var media = (numero1 + numero2 + numero3 + numero4 + numero5 + numero6) / 6;

        alert("Os numeros inseridos foram: " + numero1 + ", " + numero2 + ", " + numero3 + ", " + numero4 + ", " + numero5 + " e " + numero6);
        alert("A média aritmética é: " + media);

    </script>

</body>
</html>
