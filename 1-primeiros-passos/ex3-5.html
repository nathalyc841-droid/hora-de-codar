<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

var aprovados = 0;
var continuar = "S";

while (continuar == "S") {

    var nota1 = parseFloat(prompt("Insira a primeira nota: "));
    var nota2 = parseFloat(prompt("Insira a segunda nota: "));

    var media = (nota1 + nota2) / 2;
    var minimo = 9.5;

    if (media >= minimo) {
        alert("aprovado");
        aprovados++;
    } else {
        alert("reprovado");
    }

    continuar = prompt("Calcular a média de outro aluno? (S/N)");
}

alert("Quantidade de alunos aprovados: " + aprovados);

    </script>
</body>
</html>
