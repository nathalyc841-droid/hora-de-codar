<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //  Leia 4 valores diferentes e informe apenas o primeiro, o último e o maior deles.

        var numero1 = Number(prompt("insira um numero:"));
        var numero2 = Number(prompt("insira um segundo numero:"));
        var numero3 = Number(prompt("insira um terceiro numero:"));
        var numero4 = Number(prompt("insira um quarto numero:"));

        var maior = numero1;
        if (numero2 > maior) {
            maior = numero2;
        }
        if (numero3 > maior) {
            maior = numero3;
        }
        if (numero4 > maior) {
            maior = numero4;
        }
        alert(" O primeiro numero inserido foi: " + numero1);
        alert(" O ultimo numero inserido foi: " + numero4);
        alert(" O maior numero inserido foi: " + maior);


    </script>
</body>
</html>
