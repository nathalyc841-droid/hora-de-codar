<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Leia dois valores. Enquanto o segundo valor for menor ou igual a zero, peça novamente esse mesmo valor. Ao final, mostre a divisão do primeiro pelo segundo.
       
        let valor1 = parseFloat(prompt("Digite o primeiro valor:")); 
let valor2; 

do { 
    valor2 = parseFloat(prompt("Digite o segundo valor:")); 
} while (valor2 <= 0); 

let divisao = valor1 / valor2; 

alert("A divisão do primeiro pelo segundo é: " + divisao);

    </script>
</body>
</html>
