<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Leia 6 notas válidas (de 0 a 10), calcule e exiba a média simples.

        let soma = 0;

    for (let i = 1; i <= 6; i++) {

    let nota = parseFloat(prompt("Digite a nota " + i + ":"));

    while (nota < 0 || nota > 10) {
        nota = parseFloat(prompt("Nota inválida! Digite uma nota entre 0 e 10:"));
    }

    soma += nota;
    }

    let media = soma / 6;

    alert("A média das 6 notas é: " + media);

    </script>
</body>
</html>
